name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  stdlib-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -S -c "import verifiable; from verifiable.core.run import load_manifest; print(verifiable.__version__)"

  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/release_artifacts.py source --ref HEAD --release ci --output-dir /tmp/vstd-release
      - run: python scripts/release_artifacts.py verify /tmp/vstd-release/verifiable-standard-ci.manifest.json

  installed-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-cache-dir --no-deps --wheel-dir dist .
      - run: python -m venv /tmp/vstd-wheel
      - run: /tmp/vstd-wheel/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/vstd-wheel/bin/verifier plan examples/generic_run/manifest.json --json
      - run: /tmp/vstd-wheel/bin/verifier run examples/generic_run/manifest.json --output /tmp/vstd-receipt
      - run: /tmp/vstd-wheel/bin/verifier validate /tmp/vstd-receipt
      - run: /tmp/vstd-wheel/bin/verifier reproduce /tmp/vstd-receipt --rerun

  conformance-gate:
    if: always()
    needs: [base, stdlib-smoke, release-integrity, installed-wheel-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every declared support and artifact check
        env:
          BASE: ${{ needs.base.result }}
          STDLIB: ${{ needs.stdlib-smoke.result }}
          RELEASE: ${{ needs.release-integrity.result }}
          WHEEL: ${{ needs.installed-wheel-smoke.result }}
        run: |
          test "$BASE" = success
          test "$STDLIB" = success
          test "$RELEASE" = success
          test "$WHEEL" = success
