<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Verifier Standard (VSTD) two-axis verification overview</title>
  <desc id="desc">Five object-mechanics layers and five collection-dynamics layers. Every layer requires separate evidence; higher layers never substitute for lower layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071724"/>
      <stop offset="0.55" stop-color="#0b2231"/>
      <stop offset="1" stop-color="#102b38"/>
    </linearGradient>
    <linearGradient id="object" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ca6a1"/>
      <stop offset="1" stop-color="#55d3bd"/>
    </linearGradient>
    <linearGradient id="graph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285d4"/>
      <stop offset="1" stop-color="#79b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1085" cy="85" r="175" fill="#1ca6a1" opacity=".05"/>
  <circle cx="100" cy="600" r="230" fill="#4285d4" opacity=".05"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="62" y="68" fill="#eaf6f6" font-size="31" font-weight="750" letter-spacing="1">VSTD</text>
    <text x="167" y="68" fill="#a8bac4" font-size="25" font-weight="450">portable · bounded · refutable</text>
    <rect x="872" y="36" width="266" height="42" rx="21" fill="#102f3d" stroke="#385361"/>
    <circle cx="901" cy="57" r="7" fill="#f2a93b"/>
    <text x="919" y="64" fill="#d7e4e8" font-size="16" font-weight="650">FOUNDER-MAINTAINED ALPHA</text>

    <text x="62" y="128" fill="#66dec8" font-size="17" font-weight="700" letter-spacing="1.6">OBJECT MECHANICS</text>
    <text x="622" y="128" fill="#8fc4ff" font-size="17" font-weight="700" letter-spacing="1.6">COLLECTION DYNAMICS</text>

    <g filter="url(#shadow)">
      <rect x="62" y="150" width="516" height="65" rx="12" fill="#102d37" stroke="#1d5557"/>
      <rect x="62" y="230" width="516" height="65" rx="12" fill="#102d37" stroke="#1d5557"/>
      <rect x="62" y="310" width="516" height="65" rx="12" fill="#102d37" stroke="#1d5557"/>
      <rect x="62" y="390" width="516" height="65" rx="12" fill="#102d37" stroke="#1d5557"/>
      <rect x="62" y="470" width="516" height="65" rx="12" fill="#102d37" stroke="#1d5557"/>
      <rect x="622" y="150" width="516" height="65" rx="12" fill="#10293c" stroke="#244f75"/>
      <rect x="622" y="230" width="516" height="65" rx="12" fill="#10293c" stroke="#244f75"/>
      <rect x="622" y="310" width="516" height="65" rx="12" fill="#10293c" stroke="#244f75"/>
      <rect x="622" y="390" width="516" height="65" rx="12" fill="#10293c" stroke="#244f75"/>
      <rect x="622" y="470" width="516" height="65" rx="12" fill="#10293c" stroke="#244f75"/>
    </g>

    <g font-size="17" font-weight="750">
      <rect x="78" y="163" width="40" height="39" rx="9" fill="url(#object)"/><text x="98" y="189" fill="#061a1b" text-anchor="middle">1</text>
      <rect x="78" y="243" width="40" height="39" rx="9" fill="url(#object)"/><text x="98" y="269" fill="#061a1b" text-anchor="middle">2</text>
      <rect x="78" y="323" width="40" height="39" rx="9" fill="url(#object)"/><text x="98" y="349" fill="#061a1b" text-anchor="middle">3</text>
      <rect x="78" y="403" width="40" height="39" rx="9" fill="url(#object)"/><text x="98" y="429" fill="#061a1b" text-anchor="middle">4</text>
      <rect x="78" y="483" width="40" height="39" rx="9" fill="url(#object)"/><text x="98" y="509" fill="#061a1b" text-anchor="middle">5</text>
      <rect x="638" y="163" width="40" height="39" rx="9" fill="url(#graph)"/><text x="658" y="189" fill="#071727" text-anchor="middle">1</text>
      <rect x="638" y="243" width="40" height="39" rx="9" fill="url(#graph)"/><text x="658" y="269" fill="#071727" text-anchor="middle">2</text>
      <rect x="638" y="323" width="40" height="39" rx="9" fill="url(#graph)"/><text x="658" y="349" fill="#071727" text-anchor="middle">3</text>
      <rect x="638" y="403" width="40" height="39" rx="9" fill="url(#graph)"/><text x="658" y="429" fill="#071727" text-anchor="middle">4</text>
      <rect x="638" y="483" width="40" height="39" rx="9" fill="url(#graph)"/><text x="658" y="509" fill="#071727" text-anchor="middle">5</text>
    </g>

    <g fill="#eef7f7" font-size="20" font-weight="650">
      <text x="137" y="188">Claim mechanics</text><text x="697" y="188">Recorded lineage</text>
      <text x="137" y="268">Verification surface</text><text x="697" y="268">Bounded collection surface</text>
      <text x="137" y="348">Substrate accountability</text><text x="697" y="348">Accountable provenance closure</text>
      <text x="137" y="428">Refutability</text><text x="697" y="428">Refutable transformation closure</text>
      <text x="137" y="508">Witness corroboration</text><text x="697" y="508">Corroborated verification network</text>
    </g>
    <g fill="#91a9b4" font-size="13" font-weight="600" text-anchor="end">
      <text data-layer="vstd-1" x="558" y="188">REF. SUBSET</text><text data-layer="graph-1" x="1118" y="188">REF. SUBSET</text>
      <text data-layer="vstd-2" x="558" y="268" fill="#f2bf68">EXPERIMENTAL</text><text data-layer="graph-2" x="1118" y="268">CANDIDATE</text>
      <text data-layer="vstd-3" x="558" y="348">IMPLEMENTED</text><text data-layer="graph-3" x="1118" y="348">CANDIDATE</text>
      <text data-layer="vstd-4" x="558" y="428">CANDIDATE</text><text data-layer="graph-4" x="1118" y="428">CANDIDATE</text>
      <text data-layer="vstd-5" x="558" y="508" fill="#f2bf68">DRAFT</text><text data-layer="graph-5" x="1118" y="508" fill="#f2bf68">DRAFT</text>
    </g>

    <rect x="242" y="562" width="716" height="40" rx="20" fill="#0b1b27" stroke="#38515e"/>
    <text x="600" y="588" text-anchor="middle" fill="#d7e6e9" font-size="17" font-weight="600">Higher depth = more checked questions · never evidence substitution</text>
  </g>
</svg>
